name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

permissions:
  contents: read

jobs:
  js-quality:
    name: JS — lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for turbo --affected

      # corepack reads packageManager from package.json (pnpm@11.1.3) and runs
      # against the host's Node, not pnpm/action-setup's bundled Node 20. The
      # latter trips ERR_PNPM_UNSUPPORTED_ENGINE because pnpm 11 needs Node
      # >=22.13. setup-node twice so the cache step runs once pnpm is on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable && corepack prepare --activate
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec turbo run lint --affected

      - name: Typecheck
        run: pnpm exec turbo run typecheck --affected

      - name: Test
        env:
          # Vite apps' `src/config/env.ts` requires VITE_CLERK_PUBLISHABLE_KEY
          # via a zod `.min(1)` schema. The value is meaningless under jsdom +
          # MSW (every Clerk call is stubbed) but has to be present so the
          # module import doesn't throw at parse time. Same shape for build.
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: pnpm exec turbo run test --affected

      - name: Build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: pnpm exec turbo run build --affected

      - name: Prettier formatting check
        run: pnpm format:check

  py-quality:
    name: Python — ruff · mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # hashFiles() is rejected by the workflow parser at the job-level `if`
    # (GHA reports "Unrecognized function: 'hashFiles'" at parse time, which
    # is what aborted every CI run since this conditional was introduced and
    # produced the 0-jobs/0-second failures). The conditional was a premature
    # optimization — ruff/mypy/pytest are sub-second when there are no Python
    # changes. Job always runs now; turbo --affected handles the JS side.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install $(cat .python-version)

      - name: Sync web-api
        working-directory: apps/web-api
        run: uv sync --frozen

      - name: Ruff check
        working-directory: apps/web-api
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: apps/web-api
        run: uv run ruff format --check .

      - name: mypy
        working-directory: apps/web-api
        run: uv run mypy .

      - name: pytest
        working-directory: apps/web-api
        run: uv run pytest

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # corepack reads packageManager from package.json (pnpm@11.1.3) and runs
      # against the host's Node, not pnpm/action-setup's bundled Node 20. The
      # latter trips ERR_PNPM_UNSUPPORTED_ENGINE because pnpm 11 needs Node
      # >=22.13. setup-node twice so the cache step runs once pnpm is on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable && corepack prepare --activate
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commits
        run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose
